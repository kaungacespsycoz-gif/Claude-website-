<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oriwis logo options</title>
<meta name="robots" content="noindex">
<style>
:root { --bg: #e8e1d4; --ink: #0f2b30; --muted: #5f7072; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Helvetica Neue", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 28px; }
h1 { font-family: Georgia, "Songti SC", serif; font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0; }
p { margin: 0; color: var(--muted); }
nav { display: flex; gap: 10px; flex-wrap: wrap; }
nav a { padding: 8px 14px; border-radius: 99px; background: var(--ink); color: #f1e9dc; text-decoration: none; font-size: .9rem; }
section { display: grid; gap: 12px; }
h2 { margin: 0; font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; }
img { width: 100%; height: auto; display: block; border-radius: 14px; }
</style>
</head>
<body>
<main>
  <h1>Oriwis logo options</h1>
  <p>Pick one number from 1 to 10 (or mix two). 请从 1 到 10 中选一个编号（也可以组合两个）。</p>
  <nav><a href="#modern">Modern set 5–10</a><a href="#classic">Classic set 1–4</a></nav>
  <section id="modern"><h2>Modern set · 5–10</h2><img src="brand/options/oriwis-logo-options-modern.png" alt="Oriwis logo options 5 to 10"></section>
  <section id="classic"><h2>Classic set · 1–4</h2><img src="brand/options/oriwis-logo-options.png" alt="Oriwis logo options 1 to 4"></section>
</main>
</body>
</html>
