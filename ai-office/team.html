<title>Glostudy AI Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap">
<style>
/* Layout: app bar; the office scene (stage) on the left with staff + activity under it; a sticky side panel on the right with Chat / Clients tabs. */
:root {
  --bg: #f2f5f7; --panel: #ffffff; --panel-2: #f6f8fa; --ink: #0f1d26; --text: #26353f; --muted: #67767f; --rule: #e2e8ec;
  --accent: #0f8a96; --accent-soft: #e1f3f4; --on-accent: #ffffff; --sun: #c27a12; --sun-soft: #fdf0db;
  --ok: #2c7d4f; --ok-soft: #e3f3e9; --bad: #b8432f; --bad-soft: #fbe6e2; --you: #0f1d26; --on-you: #ffffff;
  --shadow: 0 1px 2px rgba(15,29,38,.05), 0 8px 24px rgba(15,29,38,.06);
  /* scene */
  --floor-a: #eef1f3; --floor-b: #dfe5e9; --ceiling: #1c2830; --mullion: #2a3741; --pillar: #d7dde1;
  --desk-top: #fdfdfc; --desk-edge: #cfd5da; --leg: #37444d; --chair: #33404a; --side: #e6eaed; --rug: #0f8a96;
  --shell: #ffffff; --shell-edge: #c9d2d8; --face: #10202a; --wood: #c39c73; --wood-2: #a98258; --reception: #f4f5f6;
  --sofa: #586c8c; --plant: #2d7a57; --plant-2: #3f9a6e; --pot: #f4f4f2; --glass: rgba(140,195,212,.16); --glass-edge: rgba(100,145,160,.55);
  --screen: #0a1820; --screen-line: #47c3cd; --lamp: #f6d08a; --slab: #c3ccd2; --glass-tint: rgba(225,240,246,.45); --ground: #d3d9dd; --road: #8e989e;
  --c1: #d9a441; --c2: #2bb3a3; --c3: #6c6fe0; --c4: #f06a4f; --c5: #e58fa6; --c6: #2fae6b;
  --sans: "Inter", -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1115; --panel: #131b21; --panel-2: #172129; --ink: #eef3f5; --text: #cbd5db; --muted: #8796a0; --rule: rgba(255,255,255,.08);
  --accent: #3cc3ce; --accent-soft: rgba(60,195,206,.13); --on-accent: #071216; --sun: #e9b25b; --sun-soft: rgba(233,178,91,.14);
  --ok: #7fd09f; --ok-soft: rgba(127,208,159,.12); --bad: #f19482; --bad-soft: rgba(241,148,130,.12); --you: #e6edf0; --on-you: #0b1115;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --floor-a: #1a242b; --floor-b: #121a20; --ceiling: #070c10; --mullion: #0d1419; --pillar: #212c34;
  --desk-top: #2b3740; --desk-edge: #1b252c; --leg: #0a0f13; --chair: #0d1418; --side: #222d35; --rug: #3cc3ce;
  --shell: #e8edf0; --shell-edge: #93a2ab; --face: #0a1014; --wood: #8c6a48; --wood-2: #6f5236; --reception: #232e36;
  --sofa: #3b4b66; --plant: #2a6e4f; --plant-2: #35885f; --pot: #cfd5d8; --glass: rgba(110,185,205,.09); --glass-edge: rgba(130,180,195,.35);
  --screen: #05090c; --screen-line: #3cc3ce; --lamp: #ffd88f; --slab: #2b363e; --glass-tint: rgba(12,22,28,.55); --ground: #1b2329; --road: #0e1418;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1115; --panel: #131b21; --panel-2: #172129; --ink: #eef3f5; --text: #cbd5db; --muted: #8796a0; --rule: rgba(255,255,255,.08);
  --accent: #3cc3ce; --accent-soft: rgba(60,195,206,.13); --on-accent: #071216; --sun: #e9b25b; --sun-soft: rgba(233,178,91,.14);
  --ok: #7fd09f; --ok-soft: rgba(127,208,159,.12); --bad: #f19482; --bad-soft: rgba(241,148,130,.12); --you: #e6edf0; --on-you: #0b1115;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --floor-a: #1a242b; --floor-b: #121a20; --ceiling: #070c10; --mullion: #0d1419; --pillar: #212c34;
  --desk-top: #2b3740; --desk-edge: #1b252c; --leg: #0a0f13; --chair: #0d1418; --side: #222d35; --rug: #3cc3ce;
  --shell: #e8edf0; --shell-edge: #93a2ab; --face: #0a1014; --wood: #8c6a48; --wood-2: #6f5236; --reception: #232e36;
  --sofa: #3b4b66; --plant: #2a6e4f; --plant-2: #35885f; --pot: #cfd5d8; --glass: rgba(110,185,205,.09); --glass-edge: rgba(130,180,195,.35);
  --screen: #05090c; --screen-line: #3cc3ce; --lamp: #ffd88f; --slab: #2b363e; --glass-tint: rgba(12,22,28,.55); --ground: #1b2329; --road: #0e1418;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font: 14.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
.app { max-width: 1400px; margin: 0 auto; padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--rule); border-radius: 10px; }

/* App bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.mark { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 1.2rem var(--display); }
.brand h1 { margin: 0; font: 600 1.25rem/1.1 var(--display); color: var(--ink); letter-spacing: -.01em; }
.brand small { color: var(--muted); font-size: .8rem; }
.counters { display: flex; flex-wrap: wrap; gap: 6px; }
.counter { display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 12px; font-size: .82rem; color: var(--muted); }
.counter b { font: 600 .95rem var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.counter i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .4; }
.counter.live i { background: var(--sun); opacity: 1; box-shadow: 0 0 0 3px var(--sun-soft); }
.counter.hot { border-color: var(--sun); }
.counter.hot b { color: var(--sun); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 11px; border-radius: 7px; font-size: .82rem; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); font-weight: 600; }
.seg-label { font-size: .72rem; color: var(--muted); margin-right: 2px; }

.settings { background: var(--panel); border: 1px solid var(--rule); box-shadow: var(--shadow); border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.settings h3 { margin: 0; font: 600 1rem var(--display); color: var(--ink); }
.settings p { margin: 0; font-size: .86rem; color: var(--muted); max-width: 72ch; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row input { padding: 8px 11px; min-width: 0; flex: 1 1 220px; }
.btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: .85rem; }
.ghost { background: transparent; border: 1px solid var(--rule); border-radius: 10px; padding: 6px 11px; font-size: .82rem; }
.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.ghost.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }

/* Main grid */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 18px; align-items: start; }
@media (max-width: 1120px) { .main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 20px; box-shadow: var(--shadow); min-width: 0; }
.stage { overflow: hidden; }
.scene-wrap { overflow-x: auto; overflow-y: hidden; background: #22262a; border-bottom: 1px solid var(--rule); }
.scene { display: block; width: 100%; min-width: 760px; height: auto; user-select: none; }
.stage-foot { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; padding: 14px 16px 16px; }
@media (max-width: 760px) { .stage-foot { grid-template-columns: minmax(0, 1fr); } }
.label { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.staff { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.staff button { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--rule); background: var(--panel-2); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.staff button:hover { border-color: var(--accent); }
.staff button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ava { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; color: #fff; font: 700 .9rem var(--display); }
.staff .who-txt { display: flex; flex-direction: column; min-width: 0; }
.staff b { color: var(--ink); font-weight: 600; font-size: .88rem; }
.staff small { color: var(--muted); font-size: .74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { margin-left: auto; width: 9px; height: 9px; border-radius: 50%; background: var(--rule); flex: none; }
.status.busy { background: var(--sun); box-shadow: 0 0 0 3px var(--sun-soft); }
.status.done { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.feed { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.feed li { display: flex; gap: 10px; font-size: .84rem; align-items: baseline; min-width: 0; }
.feed time { color: var(--muted); font-size: .74rem; font-variant-numeric: tabular-nums; flex: none; width: 38px; }
.feed span { min-width: 0; overflow-wrap: anywhere; }
.feed .dotc { width: 7px; height: 7px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.feed-empty { color: var(--muted); font-size: .84rem; margin-top: 8px; }

/* Photo view */
.photo-view { overflow-x: auto; background: #0e0f12; }
.photo-frame { position: relative; min-width: 720px; max-width: 1100px; margin: 0 auto; overflow: hidden; aspect-ratio: 1280 / 960; }
.photo-frame > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.03); transition: transform .6s ease-out; }
.hotspots { position: absolute; inset: 0; }
.hs { position: absolute; border: 0; padding: 0; background: transparent; border-radius: 14px; }
.hs:focus-visible { outline: 2px solid #fff; }
.hs::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 2px var(--c); opacity: 0; transition: opacity .2s; }
.hs:hover::after, .hs.selected::after { opacity: .9; }
.hs-tag { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -6px); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  background: rgba(12,14,18,.78); color: #f2f5f7; font: 600 .74rem var(--sans); padding: 3px 9px 3px 7px; border-radius: 999px; backdrop-filter: blur(4px); }
.hs-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); }
.hs-tag em { font-style: normal; font-weight: 500; color: #b9c3ca; }
.hs.selected .hs-tag { background: #fff; color: #0f1d26; }
.hs.selected .hs-tag em { color: #5d6b74; }
.hs-glow { position: absolute; left: 50%; top: 30%; width: 160%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, var(--c) 0%, transparent 62%); opacity: 0; mix-blend-mode: screen; transition: opacity .4s; pointer-events: none; }
.hs-holo { position: absolute; left: 100%; top: 18%; width: 95%; aspect-ratio: 1.45; border: 1.5px solid var(--c); border-radius: 6px; opacity: 0; transform: perspective(300px) rotateY(-24deg) scale(.9); transition: opacity .4s, transform .4s; pointer-events: none;
  background: linear-gradient(transparent 0 0) , repeating-linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, transparent) 0 2px, transparent 2px 7px); box-shadow: 0 0 14px var(--c), inset 0 0 12px color-mix(in srgb, var(--c) 40%, transparent); background-size: 100% 200%; }
.hs-bubble { position: absolute; right: -14%; top: -2%; background: #fff; color: var(--c); border-radius: 999px; padding: 0 6px; font: 700 .8rem/1.2 var(--sans); letter-spacing: 1px; opacity: 0; transition: opacity .2s; }
.hs-check { position: absolute; right: -16%; top: -4%; width: 22px; height: 22px; border-radius: 50%; background: #2fbf71; color: #fff; display: grid; place-items: center; font: 700 .8rem var(--sans); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .3s; }
.hs.working .hs-glow { opacity: .45; }
.hs.working .hs-holo { opacity: .95; transform: perspective(300px) rotateY(-24deg) scale(1); }
.hs.working .hs-bubble { opacity: 1; }
.hs.just-done .hs-check { opacity: 1; transform: scale(1); }
.hs.boss .hs-tag { background: rgba(232,193,122,.92); color: #1a140c; }
.hs.boss .hs-tag em { color: #4a3a22; }
.hs.boss .hs-tag i { background: #1a140c; box-shadow: none; }
.hs-badge { position: absolute; right: 8%; top: 8%; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #e0463c; color: #fff; font: 700 .78rem/22px var(--sans); text-align: center; box-shadow: 0 0 0 3px rgba(224,70,60,.3); }
.call-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.call-lines line { stroke-width: 2.5; stroke-dasharray: 6 6; opacity: .9; filter: drop-shadow(0 0 4px currentColor); }
.hs.calling .hs-tag::before { content: "☎"; margin-right: 2px; }
.note-fly { position: absolute; width: 18px; height: 22px; margin: -11px 0 0 -9px; border-radius: 3px; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.4), 0 0 0 2.5px var(--c); pointer-events: none; z-index: 3;
  background-image: repeating-linear-gradient(180deg, transparent 0 4px, #c7ccd1 4px 5px); background-size: 70% 70%; background-position: center; background-repeat: no-repeat; }
@media (prefers-reduced-motion: no-preference) { .call-lines line { animation: dash .6s linear infinite; } @keyframes dash { to { stroke-dashoffset: -12; } } }
.meet-card { position: absolute; left: 58.5%; top: 4%; width: 26%; min-width: 190px; background: rgba(12,14,18,.86); color: #eef2f4; border-radius: 14px; padding: 10px 12px; z-index: 4; backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(0,0,0,.4); max-height: 50%; overflow-y: auto; }
.meet-head { display: flex; justify-content: space-between; align-items: center; font: 600 .86rem var(--display); }
.meet-x { background: transparent; border: 0; color: #cfd6db; font-size: 1.1rem; line-height: 1; padding: 0 2px; }
.meet-faces { display: flex; gap: 4px; margin: 8px 0; flex-wrap: wrap; }
.meet-faces span, .meet-line span { width: 26px; height: 26px; border-radius: 8px; background-size: cover; background-position: center 30%; box-shadow: 0 0 0 2px var(--c); flex: none; }
.meet-body { font-size: .76rem; line-height: 1.45; display: flex; flex-direction: column; gap: 6px; }
.meet-sum { margin: 0; color: #fff; font-weight: 600; }
.meet-line { display: flex; gap: 8px; align-items: flex-start; }
.meet-line p { margin: 0; color: #d6dde2; }
.meet-line b { color: #fff; }
.meet-line.decide { background: rgba(232,193,122,.15); border-radius: 8px; padding: 4px 8px; }
.hs.meeting .hs-tag { box-shadow: 0 0 0 1.5px var(--c); }
.hs-badge.intel { right: auto; left: 92%; top: -2%; background: #2f6fe0; box-shadow: 0 0 0 3px rgba(47,111,224,.3); white-space: nowrap; }
.plate { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; padding: 2px 10px 4px; pointer-events: none; z-index: 2; white-space: nowrap;
  /* clear acrylic block, engraved text, LED strip in the base */
  background: linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 45%, rgba(255,255,255,.12) 100%);
  border: 1px solid rgba(255,255,255,.5); border-radius: 2px; backdrop-filter: blur(2px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.75), inset 1px 0 0 rgba(255,255,255,.35), inset -1px 0 0 rgba(255,255,255,.35), 0 6px 14px rgba(0,0,0,.4); }
.plate::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: -3px; height: 3px; border-radius: 0 0 2px 2px; background: #fff3dc;
  box-shadow: 0 0 6px 2px rgba(255,226,170,.85), 0 0 16px 4px rgba(255,214,150,.45); }
.plate b { font: italic 600 .66rem/1.15 "Playfair Display", Georgia, serif; color: rgba(255,255,255,.94); text-shadow: 0 0 6px rgba(255,236,200,.85), 0 1px 0 rgba(0,0,0,.3); }
.plate span { font: italic 500 .5rem/1.2 "Playfair Display", Georgia, serif; color: rgba(255,255,255,.85); text-shadow: 0 0 5px rgba(255,236,200,.7), 0 1px 0 rgba(0,0,0,.3); }
.plate.gold-you b, .plate.gold-you span { color: #ffe6b0; text-shadow: 0 0 7px rgba(255,205,120,.9), 0 1px 0 rgba(0,0,0,.3); }
.floor-tag { position: absolute; right: 1%; transform: translateY(-50%); background: rgba(12,14,18,.78); color: #f1f4f6; font: 600 .7rem var(--sans); letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; pointer-events: none; backdrop-filter: blur(4px); }
.folder-fly { position: absolute; width: 30px; height: 22px; margin: -11px 0 0 -15px; border-radius: 3px; background: #f6d99b; border: 1.5px solid #c9902f; box-shadow: 0 4px 14px rgba(0,0,0,.45), 0 0 0 3px var(--c); pointer-events: none; z-index: 3; }
.folder-fly::before { content: ""; position: absolute; left: -1.5px; top: -6px; width: 12px; height: 6px; background: #e3b25f; border-radius: 2px 2px 0 0; }
.pv-card { position: absolute; right: 14px; bottom: 14px; display: flex; gap: 10px; align-items: center; background: rgba(12,14,18,.8); color: #f2f5f7; border-radius: 16px; padding: 8px 14px 8px 8px; backdrop-filter: blur(6px); max-width: 60%; }
.pv-card img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
.pv-card b { display: block; font: 600 1rem var(--display); }
.pv-card small { color: #b9c3ca; font-size: .78rem; }
@media (prefers-reduced-motion: no-preference) {
  .hs.working .hs-holo { animation: holo 2.4s linear infinite; }
  .hs.working .hs-glow { animation: breathe 2s ease-in-out infinite; }
  .hs.working .hs-bubble { animation: pulse .6s ease-in-out infinite alternate; }
  @keyframes holo { to { background-position: 0 100%; } }
  @keyframes breathe { 50% { opacity: .2; } }
}
.ava.photo { background-size: cover; background-position: center 30%; color: transparent; }

/* 3D view */
.stage-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.stage-tools { display: flex; gap: 8px; align-items: center; }
.view3d { position: relative; height: clamp(340px, 52vw, 640px); background: #0e0f12; overflow: hidden; }
.v3canvas { position: absolute; inset: 0; }
.v3canvas canvas { display: block; cursor: grab; }
.v3hint { position: absolute; left: 12px; bottom: 10px; margin: 0; font-size: .74rem; color: #e8edf0; background: rgba(10,12,15,.55); padding: 4px 10px; border-radius: 999px; pointer-events: none; }
.v3note { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; color: #cfd6db; font-size: .9rem; pointer-events: none; }
.v3note:empty { display: none; }

/* Side panel */
.side { display: flex; flex-direction: column; position: sticky; top: 16px; height: calc(100vh - 96px); max-height: 880px; min-height: 560px; overflow: hidden; }
@media (max-width: 1120px) { .side { position: static; height: 80vh; } }
.tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--rule); }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 10px; border-radius: 10px; font-weight: 600; font-size: .86rem; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--ink); }
.tabs .num { background: var(--sun); color: #fff; border-radius: 999px; font-size: .7rem; padding: 0 6px; line-height: 1.5; }
.pane { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.chat-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.chat-head .ava { width: 46px; height: 46px; border-radius: 14px; }
.chat-head h2 { margin: 0; font: 600 1.02rem/1.2 var(--display); color: var(--ink); }

    items.slice(0, 30).forEach(function (c) {
      var mins = Math.round((now - new Date(c.updated || c.created)) / 60000);
      lines.push("- " + (c.name || "New client") + " | status: " + c.status + " | booked: " + (c.created || "").slice(0, 16).replace("T", " ") + " | last change " + mins + " min ago" + (c.error ? " | problem: " + c.error : "") + "\n  summary: " + String(c.summary || "").replace(/\n/g, "; ").slice(0, 300));
    });
    lines.push("Activity (newest first):"); state.activity.forEach(function (a) { lines.push("- " + hhmm(a.t) + " " + a.text); });
    if (!state.activity.length) lines.push("- none yet today");
    var tests = Object.keys(state.results);
    lines.push("Automatic tests run on Huan this session: " + tests.length + " (" + tests.filter(function (k) { return state.results[k] === "pass"; }).length + " passed, " + tests.filter(function (k) { return state.results[k] === "fail"; }).join(", ").replace(/en|zh/g, "") + " failed)");
    lines.push("Busy right now: " + (Object.keys(state.busy).map(function (id) { return BY_ID[id].name; }).join(", ") || "nobody"));
    lines.push("Engine: " + state.engine + " · reply language: " + state.lang);
    lines.push("\n【今日资讯】Spark's daily news check:\n" + intelText());
    return lines.join("\n");
  }
  function chat() { return state.chats[state.bot.id] || (state.chats[state.bot.id] = []); }
  function tasksFor(b) {
    var en = state.lang === "en";
    if (b.id === "1") return [{ ask: DEMO[state.lang], demo: true }].concat(state.tests.map(function (t) {
      return { ask: en ? t.ask_en || t.ask : t.ask, expect: en ? t.expect_en || t.expect : t.expect,
        must: t.must || [], must_not: en ? t.must_not_en || [] : t.must_not || [], key: t.id + state.lang };
    }));
    return (b.tasks || []).map(function (t) { return { ask: t[state.lang] }; });
  }

  function drawChat() {
    var b = state.bot;
    $("chatAva").textContent = b.name[0]; $("chatAva").className = "ava photo"; $("chatAva").style.backgroundColor = "var(" + b.color + ")"; $("chatAva").style.backgroundImage = "url(" + imgURL(IMG[b.id]) + ")";
    $("chatName").textContent = b.name;
    $("chatRole").textContent = b.title + " · " + b.who;
    $("chatIntro").textContent = b.intro + (b.id === "1" ? " Test questions are checked automatically." : "");
    var chips = $("chips"); chips.textContent = "";
    tasksFor(b).forEach(function (t) {
      var c = document.createElement("button");
      c.type = "button"; c.className = "chip" + (t.demo ? " demo" : "") + (t.key && state.results[t.key] ? " " + state.results[t.key] : "");
      var first = t.ask.split("\n")[0];
      c.textContent = t.demo ? "Demo booking" : first.length > 44 ? first.slice(0, 44) + "…" : first;
      c.title = t.ask;
      c.onclick = function () { send(t.ask, t.expect ? t : null); };
      chips.appendChild(c);
    });
    var s = $("send"), mine = state.busy[b.id] === "chat";
    s.textContent = mine ? "Stop" : "Send";
    if (mine) s.setAttribute("data-stop", ""); else s.removeAttribute("data-stop");
    $("box").placeholder = "Message " + b.name + "…";
    drawLog();
  }

  function drawLog() {
    var log = $("log"), turns = chat(); log.textContent = "";
    if (!turns.length) log.innerHTML = '<div class="empty"><b>' + esc(state.bot.name) + ' is ready</b>Pick something to try above, or type your own message.</div>';
    turns.forEach(function (t) {
      var d = document.createElement("div");
      if (t.kind === "check") {
        d.className = "check " + (t.ok ? "pass" : "fail");
        d.innerHTML = (t.ok ? "✓ Passed the automatic check" : "✗ Failed: " + esc(t.problems.join(", "))) + "<small>Should: " + esc(t.expect) + "</small>";
      } else if (t.kind === "note") {
        d.className = "note" + (t.good ? " good" : ""); d.textContent = t.text;
      } else if (t.kind === "team") {
        var waiting = t.items.filter(function (it) { return it.note === null; });
        d.className = "team-notes";
        d.innerHTML = '<details><summary>' + (waiting.length ? '<span class="typing"><i></i><i></i><i></i></span> ' + esc(t.from || "Huan") + ' is asking ' : '✓ Team notes from ') +
          esc(t.items.map(function (it) { return BY_ID[it.id].name; }).join(" and ")) + ' <em>(only you see these)</em></summary>' +
          t.items.map(function (it) { var b = BY_ID[it.id]; return '<div class="tn"><b style="color:' + COLORS[b.color] + '">' + esc(b.name) + '</b> <small>' + esc(it.task) + '</small><div class="pre">' + (it.note === null ? "Working…" : render(it.note)) + "</div></div>"; }).join("") +
          "</details>";
      } else if (t.pending) {
        d.className = "msg bot"; d.innerHTML = '<span class="typing" aria-label="Working"><i></i><i></i><i></i></span>';
      } else {
        d.className = "msg " + (t.role === "user" ? "user" : "bot");
        if (t.role === "user") d.textContent = t.content; else d.innerHTML = render(t.content);
      }
      log.appendChild(d);
    });
    log.scrollTop = log.scrollHeight;
  }

  function setBusy(id, kind) { if (kind) state.busy[id] = kind; else delete state.busy[id]; sceneWorking(id, !!kind); drawFloor(); drawHud(); if (state.bot.id === id) drawChat(); }
  function flashDone(id) { state.done[id] = true; sceneDone(id); drawFloor(); setTimeout(function () { delete state.done[id]; drawFloor(); }, 4000); }
  function needsKey() { return state.engine === "deepseek" && !deep.key; }

  async function send(text, test) {
    text = String(text || "").trim();
    if (!text) return;
    var bot = state.bot, turns = chat();
    if (state.busy[bot.id]) { turns.push({ kind: "note", text: bot.name + " is busy right now. Wait a moment, then try again." }); drawLog(); return; }
    if (needsKey()) { state.settingsOpen = true; drawSettings(); turns.push({ kind: "note", text: COPY.no_key }); drawLog(); return; }
    turns.push({ role: "user", content: text });
    var reply = { role: "assistant", content: "", pending: true };
    turns.push(reply);
    delete state.done[bot.id];
    state.ctl[bot.id] = new AbortController();
    setBusy(bot.id, "chat");
    var ok = false;
    try {
      var history = turns.filter(function (t) { return (t.role === "user" || t.role === "assistant") && !t.pending; })
        .slice(-20).map(function (t) { return { role: t.role, content: t.content }; });
      var extra = "", meeting = bot.id === "5" && /meeting|开会|会议/i.test(text);
      if (meeting) { pvMeeting(true); activity("5", "Ling called a team meeting in the meeting room"); }
      if ((bot.id === "1" || (bot.id === "5" && !meeting && !/brief|简报/i.test(text))) && text.length > 12) {
        var calls = await routeQuestion(text, history, bot.id === "5");
        if (calls.length && !state.ctl[bot.id].signal.aborted) {
          var notesTurn = { kind: "team", from: bot.name, items: calls.map(function (c) { return { id: TEAM_IDS[c.who], task: c.task, note: null }; }) };
          turns.splice(turns.indexOf(reply), 0, notesTurn); drawLog();
          extra = await consultTeam(calls, text, notesTurn, bot.id);
        }
      }
      var res = await ask(bot, history, {
        extraRules: extra,
        signal: state.ctl[bot.id].signal,
        onText: function (txt) { reply.pending = false; reply.content = txt; if (state.bot === bot) drawLog(); }
      });
      reply.pending = false; reply.content = res.text; ok = true;
      if (res.truncated) turns.push({ kind: "note", text: "The answer was cut short. Ask it to continue, or ask for less at once." });
      if (test) {
        var low = res.text.toLowerCase();
        var problems = test.must_not.filter(function (w) { return low.indexOf(w.toLowerCase()) >= 0; }).map(function (w) { return 'said "' + w + '"'; })
          .concat(test.must.filter(function (w) { return res.text.indexOf(w) < 0; }).map(function (w) { return w === "转人工" ? "didn't hand over to a person" : 'missing "' + w + '"'; }));
        state.results[test.key] = problems.length ? "fail" : "pass";
        turns.push({ kind: "check", ok: !problems.length, problems: problems, expect: test.expect });
        activity(bot.id, bot.name + (problems.length ? " failed a test" : " passed a test"));
      }
      if (bot.id === "1") await maybeSaveBooking(res.text, turns);
      if (bot.id === "5" && /brief|简报/i.test(text)) { activity("5", "Ling put today's brief on Aliya's desk"); deliver("5", "boss"); }
      if (meeting) pvMeetingMinutes(res.text);
    } catch (e) {
      reply.pending = false;
      if (e && e.text && e.code !== "refused") reply.content = e.text; else turns.splice(turns.indexOf(reply), 1);
      if (!e || e.code !== "cancelled") turns.push({ kind: "note", text: errText(e) });
      if (bot.id === "5") pvMeeting(false);
      if (e && (e.code === "no_key" || e.code === "bad_key")) { state.settingsOpen = true; drawSettings(); }
    } finally {
      delete state.ctl[bot.id];
      setBusy(bot.id, null);
      if (ok) flashDone(bot.id);
    }
  }

  // ---------- Huan -> client board -> Scout ----------
  function extractBooking(text) {
    var i = text.indexOf("【咨询登记】"); if (i < 0) return null;
    var j = text.indexOf("【登记完成】", i);
    var s = text.slice(i + 6, j < 0 ? undefined : j).trim();
    return s.length > 20 ? s : null;
  }
  function guessName(summary) {
    var m = summary.match(/^\s*[-*•]?\s*(?:称呼|Name|Contact name|Name\/contact|Name \/ contact|Name & contact)[^：:\n]*[：:]\s*([^\n]+)/im);
    if (m) { var n = m[1].replace(/\*\*/g, "").split(/[\/／,，|]/)[0].trim(); if (n) return n.slice(0, 40); }
    return "New client";
  }
  async function maybeSaveBooking(text, turns) {
    var summary = extractBooking(text); if (!summary) return;
    var existing = state.chatClient["1"] && store.get(state.chatClient["1"]);
    var name = guessName(summary);
    try {
      if (existing) {
        if (existing.summary === summary) return;
        await store.update(existing.id, { summary: summary, name: name, updated: new Date().toISOString() });
        turns.push({ kind: "note", good: true, text: "Updated " + name + " on the client board." });
        activity("1", "Huan updated " + name + "'s booking");
        if (existing.status !== "approved" && existing.status !== "rejected") queueJob(existing.id);
      } else {
        var id = await store.add({ name: name, summary: summary, status: "new", lang: state.lang, created: new Date().toISOString(), draft: "", error: "" });
        state.chatClient["1"] = id;
        turns.push({ kind: "note", good: true, text: "Saved " + name + " as a new client. Huan is taking the folder to Scout." });
        activity("1", "Huan booked " + name + " and took the folder to Scout");
        deliver("1", "scout");
        setTimeout(function () { queueJob(id); }, REDUCED ? 0 : 1800);
      }
    } catch (e) {
      turns.push({ kind: "note", text: "Couldn't save this client to the board." });
    }
    if (state.bot.id === "1") drawLog();
  }

  function queueJob(id, note) {
    state.jobs = state.jobs.filter(function (j) { return j.id !== id; });
    state.jobs.push({ id: id, note: note || "" });
    runJobs();
  }
  async function runJobs() {
    if (state.busy["2"] || !state.jobs.length) return;
    var job = state.jobs.shift(), c = store.get(job.id);
    if (!c) { runJobs(); return; }
    if (needsKey()) { await store.update(c.id, { status: "new", error: COPY.no_key }); runJobs(); return; }
    var scout = BY_ID["2"];
    setBusy("2", "job");
    try {
      await store.update(c.id, { status: "researching", error: "" });
      var msg = (state.lang === "en" ? "New client from the front desk. Please draft the shortlist.\n\n" : "前台新登记的客户，请出匹配清单草稿。\n\n") + "【咨询登记】\n" + c.summary;
      if (job.note) msg += (state.lang === "en" ? "\n\nYour previous draft:\n" : "\n\n你上一版草稿：\n") + (c.draft || "") + (state.lang === "en" ? "\n\nConsultant's feedback, please redo the draft with this in mind:\n" : "\n\n顾问意见，请据此重做草稿：\n") + job.note;
      var res = await ask(scout, [{ role: "user", content: msg }], {});
      await store.update(c.id, { status: "review", draft: res.text, updated: new Date().toISOString() });
      flashDone("2");
      activity("2", "Scout finished a shortlist for " + (c.name || "a client") + " and took it to Aliya's desk");
      setTimeout(function () { deliver("2", "boss"); }, 600);
    } catch (e) {
      try { await store.update(c.id, { status: "new", error: errText(e) }); } catch (e2) {}
      activity("2", "Scout couldn't finish " + (c.name || "a client") + "'s shortlist");
    } finally {
      setBusy("2", null);
      runJobs();
    }
  }

  // ---------- client board ----------
  var STATUS = { "new": ["New", ""], researching: ["Scout is working", "busy"], review: ["Waiting for your review", "busy"], approved: ["Approved", "done"], rejected: ["Rejected", "bad"] };
  function when(iso) { try { var d = new Date(iso); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + hhmm(d); } catch (e) { return ""; } }

  function drawBoard() {
    var box = $("cards"), focus = document.activeElement && document.activeElement.id, sel = null;
    if (focus && document.activeElement.selectionStart != null) sel = [document.activeElement.selectionStart, document.activeElement.selectionEnd];
    $("boardNote").textContent = store.problem || (store.mode() === "db"
      ? "Shared with everyone you share this page with."
      : IN_CLAUDE ? "Loading the shared client list…" : "Kept in this browser on this computer.");
    if (IN_CLAUDE && !store.ready()) { box.innerHTML = '<div class="board-empty">Loading clients…</div>'; return; }
    var items = store.items().filter(function (c) { return state.filter === "review" ? c.status === "review" : true; });
    box.textContent = "";
    if (!items.length) {
      box.innerHTML = '<div class="board-empty">' + (state.filter === "review" ? "Nothing waiting for review." : "No clients yet. Chat with Huan and try the demo booking: the client appears here.") + "</div>";
      return;
    }
    items.forEach(function (c) {
      var st = STATUS[c.status] || STATUS["new"], card = document.createElement("article");
      card.className = "client"; card.setAttribute("data-status", c.status || "new");
      var h = '<div class="client-top"><b>' + esc(c.name || "New client") + '</b><span class="pill ' + st[1] + '">' + st[0] + "</span><small>" + esc(when(c.created)) + "</small></div>";
      if (c.error) h += '<div class="note" style="align-self:flex-start;text-align:left">' + esc(c.error) + "</div>";
      h += '<details><summary>Booking summary</summary><div class="pre">' + esc(c.summary || "") + "</div></details>";
      if (c.status === "researching") h += '<div><span class="typing" aria-label="Scout is working"><i></i><i></i><i></i></span></div>';
      if (c.draft && c.status !== "researching") {
        if (state.editing[c.id]) {
          h += '<label class="label" for="ed' + c.id + '">Edit Scout\'s draft</label><textarea id="ed' + c.id + '" data-edit="' + c.id + '">' + esc(state.edits[c.id] != null ? state.edits[c.id] : c.draft) + "</textarea>" +
            '<div class="acts"><button class="btn" type="button" data-act="saveEdit" data-id="' + c.id + '">Save edit</button><button class="ghost" type="button" data-act="cancelEdit" data-id="' + c.id + '">Cancel</button></div>';
        } else {
          h += '<details' + (c.status === "review" ? " open" : "") + '><summary>Scout\'s shortlist draft</summary><div class="draft">' + render(c.draft) + "</div></details>";
        }
      }
      var acts = "";
      if (c.status === "review" && !state.editing[c.id]) {
        acts += '<button class="btn" type="button" data-act="approve" data-id="' + c.id + '">Approve</button>' +
          '<button class="ghost" type="button" data-act="edit" data-id="' + c.id + '">Edit</button>' +
          '<button class="ghost danger" type="button" data-act="reject" data-id="' + c.id + '">Reject</button>';
      }
      if (c.status === "new") acts += '<button class="btn" type="button" data-act="scout" data-id="' + c.id + '"' + (state.busy["2"] ? " disabled" : "") + ">Send to Scout</button>";
      if (c.status === "approved") acts += '<button class="ghost" type="button" data-act="copy" data-id="' + c.id + '">Copy draft</button><button class="ghost" type="button" data-act="reopen" data-id="' + c.id + '">Reopen</button>';
      if (c.status === "rejected") acts += '<button class="ghost" type="button" data-act="reopen" data-id="' + c.id + '">Reopen</button>';
      if (acts) h += '<div class="acts">' + acts + "</div>";
      if (c.status === "review" && !state.editing[c.id]) {
        h += '<div class="row"><label for="nt' + c.id + '" hidden>Feedback for Scout</label><input id="nt' + c.id + '" data-note="' + c.id + '" placeholder="Feedback, e.g. add more London options" value="' + esc(state.notes[c.id] || "") + '">' +
          '<button class="ghost" type="button" data-act="redo" data-id="' + c.id + '">Send back</button></div>';
      }
      card.innerHTML = h;
      box.appendChild(card);
    });
    if (focus) { var el = $(focus); if (el) { el.focus({ preventScroll: true }); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
  }

  $("cards").addEventListener("input", function (ev) {
    var t = ev.target;
    if (t.dataset.edit) state.edits[t.dataset.edit] = t.value;
    if (t.dataset.note) state.notes[t.dataset.note] = t.value;
  });
  $("cards").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-act]"); if (!b) return;
    var id = b.dataset.id, c = store.get(id); if (!c) return;
    var act = b.dataset.act, now = new Date().toISOString(), name = c.name || "a client";
    function upd(p) { b.disabled = true; store.update(id, Object.assign({ updated: now }, p)).catch(function () { b.disabled = false; }); }
    if (act === "approve") { upd({ status: "approved" }); activity(null, "You approved " + name + "'s shortlist"); }
    else if (act === "reject") { upd({ status: "rejected" }); activity(null, "You rejected " + name + "'s shortlist"); }
    else if (act === "reopen") upd({ status: c.draft ? "review" : "new" });
    else if (act === "edit") { state.editing[id] = true; state.edits[id] = c.draft; drawBoard(); }
    else if (act === "cancelEdit") { delete state.editing[id]; delete state.edits[id]; drawBoard(); }
    else if (act === "saveEdit") { var v = state.edits[id]; delete state.editing[id]; delete state.edits[id]; upd({ draft: v, edited: true }); }
    else if (act === "scout") queueJob(id);
    else if (act === "redo") {
      var note = (state.notes[id] || "").trim();
      if (!note) { var inp = $("nt" + id); if (inp) { inp.focus(); inp.placeholder = "Write what Scout should change first"; } return; }
      delete state.notes[id]; queueJob(id, note); activity(null, "You sent " + name + "'s shortlist back to Scout");
    } else if (act === "copy") {
      try { navigator.clipboard.writeText(c.draft || "").then(function () { b.textContent = "Copied"; }, function () { b.textContent = "Couldn't copy"; }); } catch (e) { b.textContent = "Couldn't copy"; }
    }
  });

  // ---------- wiring ----------
  function drawAll() { drawFloor(); drawHud(); drawChat(); drawSettings(); setTab(state.tab); }
  function setLang(l) { if (state.lang === l) return; state.lang = l; lsSet("glostudy-lang", l); drawAll(); }
  $("langEn").onclick = function () { setLang("en"); };
  $("langZh").onclick = function () { setLang("zh"); };
  $("engClaude").onclick = function () { if (IN_CLAUDE) { state.engine = "claude"; state.settingsOpen = false; drawAll(); } };
  $("engDeep").onclick = function () {
    if (!IN_CLAUDE) state.engine = "deepseek";
    state.settingsOpen = !state.settingsOpen; drawAll();
  };
  $("tabChat").onclick = function () { setTab("chat"); };
  $("v3d").onclick = function () { setView("3d"); };
  $("vPhoto").onclick = function () { setView("photo"); };
  $("vPlan").onclick = function () { setView("plan"); };
  $("vReset").onclick = function () { if (v3 && state.view === "3d") v3.reset(); };
  document.addEventListener("visibilitychange", function () { if (!v3) return; if (document.hidden) v3.pause(); else if (state.view === "3d") v3.resume(); });
  $("tabClients").onclick = function () { setTab("clients"); };
  $("fAll").onclick = function () { state.filter = "all"; drawHud(); drawBoard(); };
  $("fReview").onclick = function () { state.filter = "review"; drawHud(); drawBoard(); };
  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var id = state.bot.id;
    if (state.busy[id] === "chat") { if (state.ctl[id]) state.ctl[id].abort(); return; }
    var v = $("box").value;
    if (!state.busy[id]) $("box").value = "";
    send(v);
  });
  $("box").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("form").requestSubmit(); }
  });
  $("clear").onclick = function () { if (!state.busy[state.bot.id]) { state.chats[state.bot.id] = []; delete state.chatClient[state.bot.id]; drawLog(); } };
  $("copy").onclick = function () {
    var text = state.bot.name + " (" + state.bot.role + ")\n\n" + chat().filter(function (t) { return t.role; }).map(function (t) { return (t.role === "user" ? "Me: " : "Robot: ") + t.content; }).join("\n\n");
    var btn = $("copy");
    function done(msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = "Copy"; }, 1600); }
    try { navigator.clipboard.writeText(text).then(function () { done("Copied"); }, function () { done("Failed"); }); } catch (e) { done("Failed"); }
  };
  $("foot").textContent = IN_CLAUDE
    ? "Running on Claude with the viewer's own Claude account; it doesn't open in mainland China. Don't enter real mainland clients' personal details here (China's PIPL limits sending them abroad): use the DeepSeek file for those. Everything the robots write is a draft: check it before it goes to a customer."
    : "Running from a file on this computer. Robots use DeepSeek with your key; clients are kept in this browser only. Everything the robots write is a draft: check it before it goes to a customer.";

  store.on(function () { drawHud(); if (state.tab === "clients") drawBoard(); });
  getFile("tests/customer-service-tests.json").then(function (t) { state.tests = typeof t === "string" ? JSON.parse(t) : t; drawChat(); }).catch(function () {});
  if (!IN_CLAUDE && !deep.key) state.settingsOpen = true;
  drawFeed();
  drawAll();
  buildPhoto();
  var savedView = lsGet("glostudy-view", "photo");
  setView(savedView === "plan" || savedView === "3d" ? savedView : "photo", true);
})();
</script>
